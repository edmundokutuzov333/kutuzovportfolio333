name: Audit original CV source
on:
  push:
    branches: ["feat/editorial-cv-native"]
    paths: [".github/workflows/cv-source-audit.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install text recognition for the original image-only CV
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
      - name: Inspect the exact document and transcribe for content preservation
        run: |
          set -euo pipefail
          mkdir -p docs/cv-source /tmp/cv-audit
          pdfinfo public/edmundo-kutuzov-cv-2026.pdf > docs/cv-source/pdf-metadata.txt
          pdftotext -layout public/edmundo-kutuzov-cv-2026.pdf /tmp/cv-audit/direct.txt
          pdftoppm -f 1 -l 1 -r 235 -png -singlefile public/edmundo-kutuzov-cv-2026.pdf /tmp/cv-audit/cv
          tesseract /tmp/cv-audit/cv.png docs/cv-source/ocr-pt-eng -l por+eng --psm 3 txt tsv
          tesseract /tmp/cv-audit/cv.png docs/cv-source/ocr-layout -l eng+por --psm 11 txt
          echo "Direct text characters: $(wc -c </tmp/cv-audit/direct.txt)"
          echo "OCR lines: $(wc -l <docs/cv-source/ocr-pt-eng.txt)"
          echo "Pages: $(pdfinfo public/edmundo-kutuzov-cv-2026.pdf | grep ^Pages:)"
          sha256sum public/edmundo-kutuzov-cv-2026.pdf > docs/cv-source/pdf-sha256.txt
      - name: Commit source audit (not public CV copy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cv-source/
          git commit -m "test(cv): audit exact raster CV transcription and page metadata"
          git push origin HEAD:feat/editorial-cv-native
