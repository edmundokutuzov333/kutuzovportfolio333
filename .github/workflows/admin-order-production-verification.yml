name: Verify production Admin order editor without publishing changes

on:
  push:
    branches: [verify/admin-order-prod-browser-20261116]

permissions:
  contents: read

jobs:
  readonly-admin-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install test dependencies
        run: |
          bun install --frozen-lockfile
          npm install --prefix .e2e --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.64.1
          .e2e/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify actual production PIN session and staged order (Chromium)
        env:
          PLAYWRIGHT_BASE_URL: https://edmundokutuzov.art
          ADMIN_E2E_WITH_BACKEND: "1"
        run: .e2e/node_modules/.bin/playwright test --config .e2e/playwright.config.mjs .e2e/tests/admin-project-order.spec.mjs
      - name: Verify actual production PIN session and staged order (Mobile Safari)
        env:
          PLAYWRIGHT_BASE_URL: https://edmundokutuzov.art
          ADMIN_E2E_WITH_BACKEND: "1"
        run: .e2e/node_modules/.bin/playwright test --config .e2e/playwright.webkit.config.mjs .e2e/tests/admin-project-order.spec.mjs
