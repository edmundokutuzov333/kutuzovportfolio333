name: Production recovered routes and Admin acceptance

on:
  push:
    branches: [verify/live-site-admin-quota-20261116]

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      PLAYWRIGHT_BASE_URL: https://edmundokutuzov.art
    steps:
      - uses: actions/checkout@v4
      - name: Install test runner
        run: |
          npm install --prefix .e2e --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.64.1
          .e2e/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Chromium production smoke — no writes
        run: .e2e/node_modules/.bin/playwright test --config .e2e/playwright.config.mjs .e2e/tests/prod-recovery-smoke.spec.mjs
      - name: Mobile Safari production smoke — no writes
        run: .e2e/node_modules/.bin/playwright test --config .e2e/playwright.webkit.config.mjs .e2e/tests/prod-recovery-smoke.spec.mjs
