name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, tests, build and asset inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit (high and critical)
        run: |
          mkdir -p reports
          bun audit --audit-level=high 2>&1 | tee reports/dependency-audit.txt

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Public data and anonymous permission contract tests
        run: bun run test:contracts

      - name: Build production bundle
        run: bun run build

      - name: Inventory existing asset manifests
        run: bun run assets:inventory
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}

      - name: Upload asset inventory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-inventory-${{ github.sha }}
          path: |
            reports/assets-inventory.json
            reports/dependency-audit.txt
          if-no-files-found: warn
          retention-days: 30

  e2e:
    name: Playwright public-route and Admin-access E2E
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install Node for the isolated Playwright runner
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install locked application dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned Playwright test runner
        run: npm install --prefix .e2e --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.64.1

      - name: Install Chromium browser
        run: .e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Playwright end-to-end tests
        run: .e2e/node_modules/.bin/playwright test --config .e2e/playwright.config.mjs

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.sha }}
          path: |
            .e2e/playwright-report
            .e2e/test-results
          if-no-files-found: warn
          retention-days: 30
