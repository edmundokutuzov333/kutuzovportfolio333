name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, tests, build and asset inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit (high and critical)
        run: |
          mkdir -p reports
          set -o pipefail
          bun audit --audit-level=high 2>&1 | tee reports/dependency-audit.txt

      - name: Generate isolated dependency-remediation proposal after audit failure
        if: failure()
        continue-on-error: true
        run: |
          set -u
          proposal="$RUNNER_TEMP/phase5-dependency-remediation"
          rm -rf "$proposal"
          mkdir -p "$proposal/source" reports/dependency-remediation
          git archive "$GITHUB_SHA" | tar -x -C "$proposal/source"
          cd "$proposal/source"
          bun install --frozen-lockfile
          set +e
          bun audit fix 2>&1 | tee "$proposal/audit-fix.txt"
          fix_status=${PIPESTATUS[0]}
          bun audit --audit-level=high 2>&1 | tee "$proposal/audit-after.txt"
          audit_status=${PIPESTATUS[0]}
          cp package.json bun.lock "$GITHUB_WORKSPACE/reports/dependency-remediation/"
          cp "$proposal/audit-fix.txt" "$GITHUB_WORKSPACE/reports/dependency-remediation/"
          cp "$proposal/audit-after.txt" "$GITHUB_WORKSPACE/reports/dependency-remediation/"
          printf 'audit_fix_exit=%s\naudit_after_exit=%s\n' "$fix_status" "$audit_status" > "$GITHUB_WORKSPACE/reports/dependency-remediation/result.txt"
          exit 0

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Public data and anonymous permission contract tests
        run: bun run test:contracts

      - name: Build production bundle
        run: bun run build

      - name: Inventory existing asset manifests
        run: bun run assets:inventory
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}

      - name: Upload asset inventory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-inventory-${{ github.sha }}
          path: |
            reports/assets-inventory.json
            reports/dependency-audit.txt
            reports/dependency-remediation/*
          if-no-files-found: warn
          retention-days: 30

  e2e:
    name: Playwright public-route and Admin-access E2E
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install Node for the isolated Playwright runner
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install locked application dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned Playwright test runner
        run: npm install --prefix .e2e --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.64.1

      - name: Install Chromium browser
        run: .e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Playwright end-to-end tests
        run: .e2e/node_modules/.bin/playwright test --config .e2e/playwright.config.mjs

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.sha }}
          path: |
            .e2e/playwright-report
            .e2e/test-results
          if-no-files-found: warn
          retention-days: 30
