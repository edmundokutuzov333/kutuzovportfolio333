name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, tests, build and asset inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      dependency_audit_failed: ${{ steps.dependency_audit.outputs.failed }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit (high and critical)
        id: dependency_audit
        continue-on-error: true
        run: |
          mkdir -p reports
          set -o pipefail
          if bun audit --audit-level=high 2>&1 | tee reports/dependency-audit.txt; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Enforce dependency audit release gate
        if: steps.dependency_audit.outcome == 'failure'
        run: |
          echo "High or critical dependency advisories block release."
          exit 1

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Public data and anonymous permission contract tests
        run: bun run test:contracts

      - name: Build production bundle
        run: bun run build

      - name: Inventory existing asset manifests
        run: bun run assets:inventory
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}

      - name: Verify original project artwork is publicly reachable
        run: bun run assets:verify

      - name: Upload asset inventory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-inventory-${{ github.sha }}
          path: |
            reports/assets-inventory.json
            reports/dependency-audit.txt
            reports/dependency-remediation/*
          if-no-files-found: warn
          retention-days: 30

  dependency-remediation:
    name: Validate and promote patched dependencies
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ always() && github.event_name == 'push' && needs.quality.outputs.dependency_audit_failed == 'true' }}
    timeout-minutes: 35
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout current main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install Node for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Generate candidate and run every available release gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          proposal="$RUNNER_TEMP/phase5-dependency-candidate"
          rm -rf "$proposal"
          mkdir -p "$proposal/source" "$RUNNER_TEMP/phase5-dependency-logs"
          git archive "$GITHUB_SHA" | tar -x -C "$proposal/source"
          cd "$proposal/source"
          bun install --frozen-lockfile
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          manifest.dependencies.zod = "^4.6.7";
          manifest.devDependencies.vite = "8.1.6";
          manifest.overrides = {
            ...(manifest.overrides ?? {}),
            "zod": "4.6.7",
            "shell-quote@<1.11.0": "1.12.0",
            "launch-editor@<=2.14.1": "2.14.2",
            "brace-expansion@<1.1.17": "1.1.18",
            "js-yaml@<4.3.1": "4.3.2",
            "nanoid@<3.3.18": "3.3.18",
            "source-map-js@<1.2.2": "1.2.2",
            "seroval@<1.6.11": "1.7.2"
          };
          writeFileSync("package.json", JSON.stringify(manifest, null, 2) + "\n");
          NODE
          rm -f bun.lock
          bun install 2>&1 | tee "$RUNNER_TEMP/phase5-dependency-logs/install.txt"
          bun audit --audit-level=high 2>&1 | tee "$RUNNER_TEMP/phase5-dependency-logs/audit.txt"
          bun run typecheck 2>&1 | tee "$RUNNER_TEMP/phase5-dependency-logs/typecheck.txt"
          bun run lint 2>&1 | tee "$RUNNER_TEMP/phase5-dependency-logs/lint.txt"
          bun run test 2>&1 | tee "$RUNNER_TEMP/phase5-dependency-logs/unit-tests.txt"
          bun run test:contracts 2>&1 | tee "$RUNNER_TEMP/phase5-dependency-logs/contracts.txt"
          bun run build 2>&1 | tee "$RUNNER_TEMP/phase5-dependency-logs/build.txt"
          bun run assets:inventory 2>&1 | tee "$RUNNER_TEMP/phase5-dependency-logs/assets-inventory.txt"
          npm install --prefix .e2e --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.64.1 2>&1 | tee "$RUNNER_TEMP/phase5-dependency-logs/playwright-install.txt"
          .e2e/node_modules/.bin/playwright install --with-deps chromium 2>&1 | tee "$RUNNER_TEMP/phase5-dependency-logs/chromium-install.txt"
          .e2e/node_modules/.bin/playwright test --config .e2e/playwright.config.mjs 2>&1 | tee "$RUNNER_TEMP/phase5-dependency-logs/playwright.txt"

          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth_header="Authorization: Bearer $GITHUB_TOKEN"
          api_version="X-GitHub-Api-Version: 2022-11-28"
          current_json=$(curl -fsS -H "$auth_header" -H "$api_version" "$api/git/ref/heads/main")
          current_sha=$(printf '%s' "$current_json" | jq -er '.object.sha')
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "main advanced during candidate validation; refusing to update it."
            exit 1
          fi
          base_tree=$(curl -fsS -H "$auth_header" -H "$api_version" "$api/git/commits/$current_sha" | jq -er '.tree.sha')
          package_blob_payload="$proposal/package-blob.json"
          lock_blob_payload="$proposal/lock-blob.json"
          jq -n --rawfile content package.json '{content: ($content | @base64), encoding: "base64"}' > "$package_blob_payload"
          jq -n --rawfile content bun.lock '{content: ($content | @base64), encoding: "base64"}' > "$lock_blob_payload"
          package_blob=$(curl -fsS -X POST -H "$auth_header" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -H "$api_version" --data-binary "@$package_blob_payload" "$api/git/blobs")
          package_blob_sha=$(printf '%s' "$package_blob" | jq -er '.sha')
          lock_blob=$(curl -fsS -X POST -H "$auth_header" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -H "$api_version" --data-binary "@$lock_blob_payload" "$api/git/blobs")
          lock_blob_sha=$(printf '%s' "$lock_blob" | jq -er '.sha')
          tree_payload=$(jq -n --arg base "$base_tree" --arg package_sha "$package_blob_sha" --arg lock_sha "$lock_blob_sha" '{base_tree:$base,tree:[{path:"package.json",mode:"100644",type:"blob",sha:$package_sha},{path:"bun.lock",mode:"100644",type:"blob",sha:$lock_sha}]}')
          tree_json=$(printf '%s' "$tree_payload" | curl -fsS -X POST -H "$auth_header" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -H "$api_version" --data-binary @- "$api/git/trees")
          tree_sha=$(printf '%s' "$tree_json" | jq -er '.sha')
          commit_payload=$(jq -n --arg message "fix(deps): patch high and critical dependency advisories" --arg tree "$tree_sha" --arg parent "$current_sha" '{message:$message,tree:$tree,parents:[$parent]}')
          commit_json=$(printf '%s' "$commit_payload" | curl -fsS -X POST -H "$auth_header" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -H "$api_version" --data-binary @- "$api/git/commits")
          commit_sha=$(printf '%s' "$commit_json" | jq -er '.sha')
          update_payload=$(jq -n --arg sha "$commit_sha" '{sha:$sha,force:false}')
          curl -fsS -X PATCH -H "$auth_header" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -H "$api_version" --data-binary "$update_payload" "$api/git/refs/heads/main" >/dev/null
          verified_sha=$(curl -fsS -H "$auth_header" -H "$api_version" "$api/git/ref/heads/main" | jq -er '.object.sha')
          if [[ "$verified_sha" != "$commit_sha" ]]; then
            echo "The dependency commit was not confirmed at main."
            exit 1
          fi
          echo "Validated dependency commit published to main: $commit_sha"
          dispatch_payload=$(jq -n '{ref:"main"}')
          curl -fsS -X POST -H "$auth_header" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -H "$api_version" --data-binary "$dispatch_payload" "$api/actions/workflows/ci.yml/dispatches" >/dev/null
          echo "Dispatched a fresh CI run against the patched main SHA."

      - name: Upload dependency candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-candidate-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/phase5-dependency-logs
          if-no-files-found: warn
          retention-days: 30

  e2e:
    name: Playwright public-route and Admin-access E2E
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install Node for the isolated Playwright runner
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install locked application dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned Playwright test runner
        run: npm install --prefix .e2e --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.64.1

      - name: Install Chromium browser
        run: .e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Playwright end-to-end tests
        run: .e2e/node_modules/.bin/playwright test --config .e2e/playwright.config.mjs

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.sha }}
          path: |
            .e2e/playwright-report
            .e2e/test-results
          if-no-files-found: warn
          retention-days: 30

  sync-route-tree:
    name: Regenerate and sync TanStack file routes
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    if: ${{ success() }}
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout the fully tested source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install locked application dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate the TanStack route tree through the Vite plugin
        run: |
          set -euo pipefail
          bun run typecheck
          grep -Fq "Route as AdminRouteImport" src/routeTree.gen.ts || {
            echo "The generated route tree does not include src/routes/admin.tsx."
            exit 1
          }
          grep -Fq "'/admin'" src/routeTree.gen.ts || {
            echo "The generated route tree does not register the /admin route."
            exit 1
          }

      - name: Commit generated route tree and start CI for the new SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "The generated route tree is already current and includes /admin."
            exit 0
          fi

          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth_header="Authorization: Bearer $GITHUB_TOKEN"
          api_version="X-GitHub-Api-Version: 2022-11-28"
          current_json=$(curl -fsS -H "$auth_header" -H "$api_version" "$api/git/ref/heads/main")
          current_sha=$(printf '%s' "$current_json" | jq -er '.object.sha')
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "main advanced during route generation; refusing to update it."
            exit 1
          fi

          base_tree=$(curl -fsS -H "$auth_header" -H "$api_version" "$api/git/commits/$current_sha" | jq -er '.tree.sha')
          blob_payload="$RUNNER_TEMP/generated-route-tree-blob.json"
          jq -n --rawfile content src/routeTree.gen.ts '{content:$content,encoding:"utf-8"}' > "$blob_payload"
          blob_json=$(curl -fsS -X POST -H "$auth_header" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -H "$api_version" --data-binary "@$blob_payload" "$api/git/blobs")
          blob_sha=$(printf '%s' "$blob_json" | jq -er '.sha')
          tree_payload=$(jq -n --arg base "$base_tree" --arg blob "$blob_sha" '{base_tree:$base,tree:[{path:"src/routeTree.gen.ts",mode:"100644",type:"blob",sha:$blob}]}')
          tree_json=$(printf '%s' "$tree_payload" | curl -fsS -X POST -H "$auth_header" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -H "$api_version" --data-binary @- "$api/git/trees")
          tree_sha=$(printf '%s' "$tree_json" | jq -er '.sha')
          commit_payload=$(jq -n --arg message "chore(router): sync generated /admin route" --arg tree "$tree_sha" --arg parent "$current_sha" '{message:$message,tree:$tree,parents:[$parent]}')
          commit_json=$(printf '%s' "$commit_payload" | curl -fsS -X POST -H "$auth_header" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -H "$api_version" --data-binary @- "$api/git/commits")
          commit_sha=$(printf '%s' "$commit_json" | jq -er '.sha')
          update_payload=$(jq -n --arg sha "$commit_sha" '{sha:$sha,force:false}')
          curl -fsS -X PATCH -H "$auth_header" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -H "$api_version" --data-binary "$update_payload" "$api/git/refs/heads/main" >/dev/null
          verified_sha=$(curl -fsS -H "$auth_header" -H "$api_version" "$api/git/ref/heads/main" | jq -er '.object.sha')
          if [[ "$verified_sha" != "$commit_sha" ]]; then
            echo "The generated route tree commit was not confirmed at main."
            exit 1
          fi
          echo "Generated route tree committed to main: $commit_sha"

          dispatch_payload=$(jq -n '{ref:"main"}')
          curl -fsS -X POST -H "$auth_header" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -H "$api_version" --data-binary "$dispatch_payload" "$api/actions/workflows/ci.yml/dispatches" >/dev/null
          echo "Dispatched a fresh CI run against the generated router SHA."

