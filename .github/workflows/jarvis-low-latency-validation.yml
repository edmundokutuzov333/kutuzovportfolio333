name: Jarvis low latency validation

on:
  push:
    branches: [fix/jarvis-low-latency-voice-20261113]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: ESLint
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Install Chromium and WebKit
        run: |
          npm install --prefix .e2e --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.64.1
          .e2e/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Chromium all-site regressions
        run: .e2e/node_modules/.bin/playwright test --config .e2e/playwright.config.mjs
      - name: WebKit mobile voice regressions
        run: .e2e/node_modules/.bin/playwright test --config .e2e/playwright.webkit.config.mjs .e2e/tests/jarvis-audio.spec.mjs
