name: Jarvis low latency voice validation

on:
  push:
    branches: [perf/jarvis-streamed-tts-20261114]

permissions:
  contents: read

jobs:
  low-latency-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Install isolated Chromium and WebKit test runner
        run: |
          npm install --prefix .e2e --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.64.1
          .e2e/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Browser audio including first-sound latency and WAV fallback
        run: .e2e/node_modules/.bin/playwright test --config .e2e/playwright.config.mjs .e2e/tests/jarvis-audio.spec.mjs
      - name: Mobile Safari audio and fallback
        run: .e2e/node_modules/.bin/playwright test --config .e2e/playwright.webkit.config.mjs .e2e/tests/jarvis-audio.spec.mjs
