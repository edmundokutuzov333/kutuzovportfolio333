name: REA black-box evidence
on:
  workflow_dispatch:
    inputs:
      full_capture:
        description: 'Recolher sitemap e evidência REA completos'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/rea-black-box.yml'
      - 'research/psychoactive/*.mjs'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install isolated inspection tools
        run: |
          mkdir -p "$RUNNER_TEMP/rea-tools"
          npm install --prefix "$RUNNER_TEMP/rea-tools" --no-audit --no-fund rea-agents@6.8.0 playwright@1.58.2
          "$RUNNER_TEMP/rea-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture complete sitemap with REA
        if: github.event_name == 'workflow_dispatch' && inputs.full_capture
        env:
          TOOL_ROOT: ${{ runner.temp }}/rea-tools
        run: node research/psychoactive/capture.mjs
      - name: Capture observable behaviour
        env:
          TOOL_ROOT: ${{ runner.temp }}/rea-tools
        run: |
          node research/psychoactive/interactions.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psychoactive-evidence
          path: research/psychoactive/evidence
          retention-days: 7
