name: Emergency CMS continuity validation

on:
  push:
    branches: [fix/public-supabase-quota-resilience-20261116]

permissions:
  contents: read

jobs:
  resilience:
    name: Published-snapshot continuity, PIN access and public routes
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Install Chromium
        run: |
          npm install --prefix .e2e --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.64.1
          .e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser public routes and protected Admin under quota restriction
        run: .e2e/node_modules/.bin/playwright test --config .e2e/playwright.config.mjs .e2e/tests/public-routes.spec.mjs
