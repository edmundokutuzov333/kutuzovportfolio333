name: Jarvis WebKit audio verification

on:
  push:
    branches:
      - verify/jarvis-audio-webkit-20261113

permissions:
  contents: read

jobs:
  voice-audio-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: |
          npm install --prefix .e2e --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.64.1
          .e2e/node_modules/.bin/playwright install --with-deps webkit
      - name: Test mobile Safari audio with recorded STT and TTS
        run: .e2e/node_modules/.bin/playwright test --config .e2e/playwright.webkit.config.mjs .e2e/tests/jarvis-audio.spec.mjs
