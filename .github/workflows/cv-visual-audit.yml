name: Visual audit of original CV
on:
  push:
    branches: ["feat/editorial-cv-native"]
    paths: [".github/workflows/cv-visual-audit.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Extract the source page image without re-encoding
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          mkdir -p docs/cv-source/source-jpg-chunks /tmp/original-cv
          pdfimages -f 1 -l 1 -j public/edmundo-kutuzov-cv-2026.pdf /tmp/original-cv/page
          file /tmp/original-cv/page-000.jpg
          base64 -w0 /tmp/original-cv/page-000.jpg | split -a 2 -d -b 24000 - docs/cv-source/source-jpg-chunks/part-
          ls -lh docs/cv-source/source-jpg-chunks
      - name: Commit transient visual-audit chunks to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cv-source/source-jpg-chunks
          git commit -m "test(cv): preserve original page visual for editorial source review"
          git push origin HEAD:feat/editorial-cv-native
