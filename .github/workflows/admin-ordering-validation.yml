name: Admin ordering pre-merge validation

on:
  push:
    branches: [feat/admin-project-order-editor-20261116]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test all unit contracts and admin access controls
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Install Chromium and Mobile Safari WebKit
        run: |
          npm install --prefix .e2e --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.64.1
          .e2e/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Chromium and Mobile Safari Admin order and PIN regression
        run: .e2e/node_modules/.bin/playwright test --config .e2e/playwright.admin-order.config.mjs .e2e/tests/admin-project-order.spec.mjs
